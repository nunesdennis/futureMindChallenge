name: Deploy Continuo (Cloudflare Tunnel)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Instala o cloudflared no runner do GitHub
      - name: Instalar Cloudflare Client
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      # 2. Configura a chave SSH e o ProxyCommand nativo do SSH
      - name: Configurar Chave SSH e Cloudflare Proxy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # Configura o SSH do Linux para usar o cloudflared automaticamente ao conectar no host
          cat <<EOF > ~/.ssh/config
          Host ${{ secrets.SERVER_HOST }}
              User ${{ secrets.SERVER_USER }}
              IdentityFile ~/.ssh/id_ed25519
              StrictHostKeyChecking no
              ProxyCommand cloudflared access ssh --hostname %h
          EOF

      # 3. Executa os comandos no seu Debian via SSH puro
      - name: Executar comandos de deploy no servidor
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /home/nunesdennis/code/futureMindChallenge
            git fetch origin main
            git reset --hard origin/main
            pip3 install -r requirements.txt --break-system-packages
            sudo systemctl restart meu-python-app
          EOF
