name: Deploy Continuo (Servidor Domestico)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Instala o cloudflared no ambiente do GitHub Actions
      - name: Instalar Cloudflare Client
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      # 2. Conecta no servidor doméstico via Túnel da Cloudflare
      - name: Executar deploy via SSH (Cloudflare Tunnel)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_command: cloudflared access ssh --hostname %h
          script: |
            cd /home/nunesdennis/code/futureMindChallenge
            git fetch origin main
            git reset --hard origin/main
            pip3 install -r requirements.txt --break-system-packages
            sudo systemctl restart meu-python-app
