<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinGuard — {% block titulo %}Reclamações{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; color: #222; min-height: 100vh; }

    header {
      background: #0d3b6e;
      color: #fff;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
    }
    header h1 { font-size: 1.3rem; letter-spacing: .04em; }
    header span { font-size: .8rem; opacity: .7; }
    nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: .9rem;
      opacity: .85;
      transition: opacity .2s;
    }
    nav a:hover { opacity: 1; text-decoration: underline; }

    .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

    .flash { padding: .8rem 1.2rem; border-radius: 6px; margin-bottom: 1.2rem; font-size: .95rem; }
    .flash.sucesso { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
    .flash.erro    { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }

    .btn {
      display: inline-block;
      padding: .65rem 1.4rem;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: all .3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,.15);
      transition: left .3s ease;
    }
    .btn:hover::before { left: 100%; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.15); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: #1a5a9f; color: #fff; }
    .btn-primary:hover { background: #164a7f; box-shadow: 0 6px 20px rgba(26, 90, 159, .3); }
    .btn-secondary { background: #7a8a99; color: #fff; }
    .btn-secondary:hover { background: #6a7a89; box-shadow: 0 6px 20px rgba(122, 138, 153, .3); }
    .btn-danger { background: #d94a54; color: #fff; }
    .btn-danger:hover { background: #c23a44; box-shadow: 0 6px 20px rgba(217, 74, 84, .3); }
    .btn-success { background: #2ba86b; color: #fff; }
    .btn-success:hover { background: #23895b; box-shadow: 0 6px 20px rgba(43, 168, 107, .3); }
    .btn-sm { padding: .45rem .9rem; font-size: .8rem; }

    .badge {
      display: inline-block;
      padding: .4em .75em;
      border-radius: 20px;
      font-size: .75rem;
      font-weight: 700;
      color: #fff;
      transition: all .2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }
    .badge::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.2) 0%, transparent 100%);
      pointer-events: none;
    }
    .badge:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.2); }
    .badge-baixa    { background: linear-gradient(135deg, #2ba86b 0%, #1e8a55 100%); }
    .badge-baixa:hover { box-shadow: 0 4px 12px rgba(43, 168, 107, .4); }
    .badge-media    { background: linear-gradient(135deg, #fd7e14 0%, #e66a00 100%); }
    .badge-media:hover { box-shadow: 0 4px 12px rgba(253, 126, 20, .4); }
    .badge-alta     { background: linear-gradient(135deg, #dc3545 0%, #c82333 100%); }
    .badge-alta:hover { box-shadow: 0 4px 12px rgba(220, 53, 69, .4); }
    .badge-critica  { background: linear-gradient(135deg, #8b0000 0%, #6f0000 100%); }
    .badge-critica:hover { box-shadow: 0 4px 12px rgba(139, 0, 0, .5); }
    .badge-aberta   { background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%); }
    .badge-aberta:hover { box-shadow: 0 4px 12px rgba(13, 110, 253, .4); }
    .badge-analise  { background: linear-gradient(135deg, #fd7e14 0%, #e66a00 100%); }
    .badge-analise:hover { box-shadow: 0 4px 12px rgba(253, 126, 20, .4); }
    .badge-resolvida{ background: linear-gradient(135deg, #2ba86b 0%, #1e8a55 100%); }
    .badge-resolvida:hover { box-shadow: 0 4px 12px rgba(43, 168, 107, .4); }
    .badge-neutro   { background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%); }
    .badge-neutro:hover { box-shadow: 0 4px 12px rgba(108, 117, 125, .4); }
    .badge-positivo { background: linear-gradient(135deg, #2ba86b 0%, #1e8a55 100%); }
    .badge-positivo:hover { box-shadow: 0 4px 12px rgba(43, 168, 107, .4); }
    .badge-negativo { background: linear-gradient(135deg, #dc3545 0%, #c82333 100%); }
    .badge-negativo:hover { box-shadow: 0 4px 12px rgba(220, 53, 69, .4); }
    .badge-critico  { background: linear-gradient(135deg, #8b0000 0%, #6f0000 100%); }
    .badge-critico:hover { box-shadow: 0 4px 12px rgba(139, 0, 0, .5); }

    footer { text-align: center; font-size: .78rem; color: #999; padding: 2rem 0 1rem; }
  </style>
</head>
<body>
<header>
  <h1>🛡 FinGuard <span>| Gestão de Reclamações</span></h1>
  <nav>
    <a href="/">Reclamações</a>
    <a href="/nova" class="btn btn-primary btn-sm" style="margin-left:1.5rem">+ Nova Reclamação</a>
  </nav>
</header>

<div class="container">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}
      <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block conteudo %}{% endblock %}
</div>

<footer>FinGuard · POL-SAC-001 v2.0 · Uso Interno</footer>
</body>
</html>
